<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    // Replace this with your actual OpenRouteService API key
    const ORS_API_KEY = 'YOUR_OPENROUTESERVICE_API_KEY_HERE';

    // Unified expense rates (per mile) — used by BOTH calculators
    const EXPENSE_RATES = {
        fuel: 0.65,
        maint: 0.20,
        overhead: 0.32,
        tolls: 0.08,
        meals: 0.07
    };
    const FEE_RATE = 0.07; // Combined 5% dispatch + 2% factoring (only if both apply)

    // Expense inclusion toggles
    const activeExpenses = {
        fuel: true,
        maint: true,
        overhead: true,
        tolls: true,
        meals: true,
        fees: true
    };

    // Cache to avoid re-geocoding the same city repeatedly
    const geoCache = {};

    // ============================================================
    // GEOCODING: City Name -> [lon, lat]
    // ============================================================
    async function geocodeCity(cityName) {
        if (geoCache[cityName]) return geoCache[cityName];

        // Strip the state abbreviation for cleaner geocoding
        const cleanName = cityName.split(',')[0].trim();

        const url = `https://api.openrouteservice.org/geocode/search?api_key=${ORS_API_KEY}&text=${encodeURIComponent(cleanName)}&size=1&boundary.country=US`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('Geocoding failed for ' + cityName);

        const data = await res.json();
        if (!data.features || data.features.length === 0) {
            throw new Error('Could not find coordinates for ' + cityName);
        }

        const coords = data.features[0].geometry.coordinates; // [lon, lat]
        geoCache[cityName] = coords;
        return coords;
    }

    // ============================================================
    // DISTANCE: Two Cities -> Miles (via OpenRouteService)
    // ============================================================
    async function getDrivingMiles(fromCity, toCity) {
        const [fromCoords, toCoords] = await Promise.all([
            geocodeCity(fromCity),
            geocodeCity(toCity)
        ]);

        // OpenRouteService expects [lon, lat] pairs
        const body = {
            coordinates: [fromCoords, toCoords]
        };

        const res = await fetch('https://api.openrouteservice.org/v2/directions/driving-hgv', {
            method: 'POST',
            headers: {
                'Authorization': ORS_API_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!res.ok) {
            const errText = await res.text();
            console.error('ORS Directions error:', errText);
            throw new Error('Routing failed. Check API key and coordinates.');
        }

        const data = await res.json();
        // Distance is returned in meters; convert to miles
        const meters = data.routes[0].summary.distance;
        const miles = meters * 0.000621371;
        return Math.round(miles);
    }

    // ============================================================
    // UNIFIED CALCULATOR (replaces both quickCalc and calculateMasterProfit)
    // ============================================================
    function computeNet(gross, miles, expensesObj) {
        const fuel = expensesObj.fuel ? miles * EXPENSE_RATES.fuel : 0;
        const maint = expensesObj.maint ? miles * EXPENSE_RATES.maint : 0;
        const overhead = expensesObj.overhead ? miles * EXPENSE_RATES.overhead : 0;
        const tolls = expensesObj.tolls ? miles * EXPENSE_RATES.tolls : 0;
        const meals = expensesObj.meals ? miles * EXPENSE_RATES.meals : 0;
        const fees = expensesObj.fees ? gross * FEE_RATE : 0;

        const totalExp = fuel + maint + overhead + tolls + meals + fees;
        const net = gross - totalExp;
        const netPerMile = miles > 0 ? net / miles : 0;

        return { fuel, maint, overhead, tolls, meals, fees, totalExp, net, netPerMile };
    }

    // ============================================================
    // UI: Quick Estimator (home page)
    // ============================================================
    function quickCalc() {
        const miles = parseFloat(document.getElementById('quick-miles').value) || 0;
        const gross = parseFloat(document.getElementById('quick-gross').value) || 0;

        if (miles > 0 && gross > 0) {
            // Use ALL expenses enabled for the quick estimate
            const result = computeNet(gross, miles, {
                fuel: true, maint: true, overhead: true, tolls: true, meals: true, fees: true
            });
            const el = document.getElementById('quick-net');
            el.innerText = '$' + result.net.toFixed(2);
            el.style.color = result.net < 0 ? '#FF5722' : '#4CAF50';
        } else {
            document.getElementById('quick-net').innerText = '$0.00';
            document.getElementById('quick-net').style.color = '#4CAF50';
        }
    }

    // ============================================================
    // UI: Master Calculator (Calc & Tools tab)
    // ============================================================
    async function calculateMasterProfit() {
        const fromCity = document.getElementById('route-from').value;
        const toCity = document.getElementById('route-to').value;
        const milesInput = document.getElementById('master-miles');
        const gross = parseFloat(document.getElementById('master-gross').value) || 0;

        // Auto-fetch miles when both cities are selected
        if (fromCity && toCity && fromCity !== toCity) {
            milesInput.value = '...'; // loading indicator
            milesInput.disabled = true;
            try {
                const miles = await getDrivingMiles(fromCity, toCity);
                milesInput.value = miles;
            } catch (err) {
                console.error(err);
                milesInput.value = '';
                alert('Could not calculate mileage: ' + err.message);
            } finally {
                milesInput.disabled = false;
            }
        } else if (fromCity && toCity && fromCity === toCity) {
            milesInput.value = 0;
        }

        const miles = parseFloat(milesInput.value) || 0;

        // Compute all expenses (respecting toggles)
        const r = computeNet(gross, miles, activeExpenses);

        // Update the breakdown display
        document.getElementById('br-fuel').innerText = '$' + r.fuel.toFixed(2);
        document.getElementById('br-maint').innerText = '$' + r.maint.toFixed(2);
        document.getElementById('br-overhead').innerText = '$' + r.overhead.toFixed(2);
        document.getElementById('br-tolls').innerText = '$' + r.tolls.toFixed(2);
        document.getElementById('br-meals').innerText = '$' + r.meals.toFixed(2);
        document.getElementById('br-fees').innerText = '$' + r.fees.toFixed(2);

        document.getElementById('master-total-exp').innerText = '$' + r.totalExp.toFixed(2);
        document.getElementById('master-net-profit').innerText = '$' + r.net.toFixed(2);
        document.getElementById('master-net-pm').innerText = '$' + r.netPerMile.toFixed(2) + ' / mi';

        // Color-code negative profit
        const profitEl = document.getElementById('master-net-profit');
        profitEl.style.color = r.net < 0 ? '#FF5722' : '#4CAF50';
    }

    // ============================================================
    // UI: Expense Toggle Buttons
    // ============================================================
    function toggleExpense(key) {
        activeExpenses[key] = !activeExpenses[key];
        const btn = document.getElementById('btn-' + key);
        if (activeExpenses[key]) {
            btn.innerText = '[-]';
            btn.classList.remove('excluded');
        } else {
            btn.innerText = '[+]';
            btn.classList.add('excluded');
        }
        calculateMasterProfit();
    }

    // ============================================================
    // UI: Fuel Hubs Modal (unchanged from your original)
    // ============================================================
    function updateModalHub() {
        const val = document.getElementById('modal-hub-select').value;
        const resDiv = document.getElementById('modal-hub-result');
        if (!val) { resDiv.style.display = 'none'; return; }
        const parts = val.split('|');
        document.getElementById('m-price').innerText = '$' + parts[0];
        document.getElementById('m-fcpm').innerText = '$' + parts[1] + ' / mi';
        document.getElementById('m-trend').innerText = parts[2];
        resDiv.style.display = 'block';
    }
</script>
